name: Akaryakit takip

on:
  schedule:
    # Her 30 dakikada bir (UTC). :07 ve :37, yogun :00 saatlerinden kacmak icin
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_bildirim:
        description: "Deneme bildirimi gonderilsin mi?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takip
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Haberleri ve kuru kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_BILDIRIM: ${{ inputs.test_bildirim && '1' || '0' }}
        run: python takip.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "akaryakit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Veri guncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
